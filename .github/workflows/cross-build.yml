name: Cross Build NTORS Static Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

permissions:
  contents: read

jobs:
  cross_build:
    name: Build (${{ matrix.os }}, ${{ matrix.profile == 'dev' && 'Debug' || 'Release' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [release, dev]
        include:
          # Linux：ubuntu-latest + cargo-cross 交叉編譯 (Debug/Release)
          - os: Linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - os: Linux
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          # Windows：ubuntu-latest + cargo-cross 交叉編譯 (Debug/Release)
          - os: Windows
            target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            cross: true
          # macOS：macos-latest 原生編譯 (Debug/Release)
          - os: macOS
            target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - os: macOS
            target: aarch64-apple-darwin
            runner: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git Credentials
        run: |
          git config --global credential.helper 'store'
          echo "https://x-access-token:${{ secrets.NDCODE3_PAT }}@github.com" > ~/.git-credentials

      - name: Fetch NDcode3 core engine (private, closed-source)
        run: git clone --depth 1 https://github.com/sam-teng/NDcode3.git NDcode3

      - name: Fetch Wintun signed DLLs (Windows targets)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          curl -fsSL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          rm -rf wintun-src && mkdir -p wintun-src
          unzip -q wintun.zip -d wintun-src
          mkdir -p assets/wintun/amd64 assets/wintun/arm64 assets/wintun/x86 assets/wintun/arm
          cp wintun-src/wintun/bin/amd64/wintun.dll assets/wintun/amd64/wintun.dll
          cp wintun-src/wintun/bin/arm64/wintun.dll assets/wintun/arm64/wintun.dll
          cp wintun-src/wintun/bin/x86/wintun.dll assets/wintun/x86/wintun.dll
          cp wintun-src/wintun/bin/arm/wintun.dll assets/wintun/arm/wintun.dll
          rm -rf wintun.zip wintun-src

      - name: Install nightly toolchain (macOS)
        if: matrix.cross == false
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cross compile (Linux / Windows)
        if: matrix.cross == true
        uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: ${{ matrix.target }}
          cross-make-version: v0.7.7
          build-std: true
          toolchain: nightly
          profile: ${{ matrix.profile }}

      - name: Build native macOS target
        if: matrix.cross == false
        shell: bash
        run: cargo +nightly build --profile ${{ matrix.profile }} --target ${{ matrix.target }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NTORS-${{ matrix.profile }}-${{ matrix.target }}
          path: |
            ./target/**/${{ matrix.profile == 'dev' && 'debug' || 'release' }}/NTORS*
          include-hidden-files: true
          if-no-files-found: warn
