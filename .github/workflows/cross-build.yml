name: Cross Build NTORS Static Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

permissions:
  contents: read

jobs:
  cross_build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux / Windows：ubuntu-latest + cargo-cross 交叉編譯
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            cross: true
          # macOS：macos-latest 原生編譯 (cargo-cross 不支援 Apple 平台)
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git Credentials
        run: |
          git config --global credential.helper 'store'
          echo "https://x-access-token:${{ secrets.NDCODE3_PAT }}@github.com" > ~/.git-credentials

      - name: Fetch NDcode3 core engine (private, closed-source)
        run: git clone --depth 1 https://github.com/sam-teng/NDcode3.git NDcode3

      - name: Install nightly toolchain (macOS)
        if: matrix.cross == false
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cross compile (Linux / Windows)
        if: matrix.cross == true
        uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: ${{ matrix.target }}
          cross-make-version: v0.7.7
          build-std: true
          toolchain: nightly
          cargo-args: --release

      - name: Build native macOS target
        if: matrix.cross == false
        shell: bash
        run: cargo +nightly build --release --target ${{ matrix.target }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NTORS-${{ matrix.target }}
          path: |
            ./target/**/release/NTORS*
          include-hidden-files: true
          if-no-files-found: warn
