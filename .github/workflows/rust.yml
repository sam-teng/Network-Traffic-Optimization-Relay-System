name: Build NTORS Rust APP Upload a Build Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # 強制 Cargo 在所有步驟中皆使用系統 Git CLI，確保順利帶入私有庫存取憑證
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CROSS_REMOTE_USER_CONFIG: true

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # 當快取儲存失敗時不要讓整個 CI 壞掉
        continue-on-error: true

    - name: Install Rust binaries
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest, cargo-hack, cargo-cross

    - name: Install All Linux System C Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libgtk-3-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev
          
    - name: Install System Dependencies (GLib)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev

    - name: Install GTK3 and System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk-3-dev
      
    - name: Configure Git Credentials
      run: |
        git config --global credential.helper 'store'
        echo "https://x-access-token:${{ secrets.NDCODE3_PAT }}@github.com" > ~/.git-credentials
        
    - name: Run tests
      run: cargo test --verbose

    - name: Build Linux
      run: cargo cross build --targets x86_64-unknown-linux-musl,aarch64-unknown-linux-musl --verbose --release

    - name: Build MacOS
      run: cargo cross build --target aarch64-apple-darwin --macos-sdk-version 11.0 --verbose --release

    - name: Build Windows
      run: cargo cross build --target x86_64-pc-windows-gnu --verbose --release

    # 將上傳步驟整合進同一個環境中，這樣才能順利抓到產出的 ./target/release/ 檔案
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1  # 建議使用穩定版 v4，或依你需求指定舊版
      with:
        name: NTORS-Release-Builds
        path: |
          ./target/**/release/NTORS*
        include-hidden-files: true
