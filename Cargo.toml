[package]
name = "NTORS"
version = "0.0.0-NDcode3-beta.8"
edition = "2024"

[lib]
name = "ntors"
path = "src/lib.rs"

[[bin]]
name = "NTORS"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
# 測試用：將 WAT 原始碼編譯為二進位 .wasm（僅 dev，不進發佈二進位）
wat = "1"

[[bench]]
name = "engine_bench"
harness = false

[[test]]
name = "functional_tests"

[dependencies]
# 錯誤處理與日誌輸出
anyhow = "1.0"
# 非同步 Runtime 與 TCP 通訊
tokio = { version = "1.38", features = ["full"] }
# Layer 3 虛擬網卡 (舊 crate：crates.io/crates/tun，import 為 `tun`)
# 保留舊 tun 0.6 作為 L3 fallback；勿與下方 `tun-rs` / `tun_rs` 混淆
tun = { version = "0.6", features = ["async"] }
# 真 tun-rs：crates.io/crates/tun-rs，import 為 `tun_rs`（與上方 `tun` 是不同 crate，勿混淆）
# 必須啟用 `async` (= `async_tokio`) 才能使用 `tun_rs::AsyncDevice` 與 `DeviceBuilder::build_async()`
# macOS 用內建 utunN/feth 建立，utun 介面建立本身不需 root；L2 TAP 需 feth/tap-windows 驅動
tun-rs = { version = "2.8", features = ["async"] }
# 命令列參數解析
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
# NDcode3 核心引擎（路徑相依；核心程式碼未隨本倉庫發佈，需自行放置於 NDcode3/ 目錄）
NDcode3 = { git = "https://github.com/sam-teng/NDcode3.git" }
# XZ 解壓（直接相依，供 decompression_guard 實作 take() 真輸出上限）
# 與 NDcode3 使用同一版本/規格，cargo 會合併為同一份建置產物，不增加體積。
# 必要性：NDcode3 的 safe_xz_decompress API 不接受 max-size 參數，
# 只有在本 crate 直接持有 XzDecoder 才能在配置完整輸出前中止（解壓炸彈防護）。
xz = "0.4.6-rc.0"
# Wasm 沙盒隧道（選項 B：Code-as-Data 解壓縮引擎，純 Rust 解譯器，支援記憶體/CPU fuel 限制）
# 關閉 default features 以排除 wat 文字解析器，縮小發佈體積；僅允許二進位 .wasm 上傳
wasmi = { version = "2.0", default-features = false, features = ["std"] }

# TLS/SSL 加密傳輸 (rustls + ring，純 Rust 免 OpenSSL)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2"
rcgen = "0.14"

# 高效能發行版 (適用於 PC / 樹莓派 / 行動端，開啟最大 SIMD 與 LTO 自動向量化)
[profile.release]
opt-level = 3       # 設為 3 以啟動 LLVM SIMD 向量化與迴圈展開
lto = "fat"         # 全域跨 Crate 鏈接優化
codegen-units = 1   # 提高向量指令生成品質
strip = true        # 剝離 Debug 符號
panic = "abort"     # 移除 Unwind 棧，減小極限體積

# 嵌入式 MCU / 極限體積發行版 (透過 cargo build --profile release-small 呼叫)
[profile.release-small]
inherits = "release"
opt-level = "z"     # 專注於代碼最小化
